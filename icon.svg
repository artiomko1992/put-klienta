  <rect x="156" y="234" width="200" height="40" rx="10" fill="#F2E36B"/>
  <rect x="181" y="288" width="150" height="40" rx="10" fill="#B6E36B"/>
  <rect x="206" y="342" width="100" height="40" rx="10" fill="#7FDDB4"/>
</svg>
